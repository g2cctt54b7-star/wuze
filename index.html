<style>html,body{margin:0;background:#0e0c0a}[hidden]{display:none!important}</style>
<title>霧澤雙生</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D diorama; thin HUD bands at the edges; overlays are letters and specimen labels */
:root{
  --ink:#0e0c0a; --ink2:#1a1611; --paper:#e8dcc4; --paper-dim:#a89c84; --rust:#9a3a22; --blood:#8e1418; --brass:#b8924e;
  --wA:#e0a862; --wB:#86b8a9;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#gl{position:fixed;inset:0;z-index:0;touch-action:none}
#gl canvas{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}
#flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(142,20,24,.15),rgba(142,20,24,.85))}

#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(10,8,6,.85),rgba(10,8,6,0));pointer-events:none}
#hud>*{pointer-events:auto}
#chap{min-width:0}
#chap .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--paper-dim);text-transform:uppercase}
#chap .n{font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.3}
#who{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--paper-dim);margin-top:2px}
#who i{width:7px;height:7px;border-radius:50%;background:#555;display:inline-block}
#who i.on{background:#7fb37a;box-shadow:0 0 6px #7fb37a}
.hb{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.hb .tb{padding:5px 7px;letter-spacing:.02em;font-size:12.5px}
.tb{background:rgba(232,220,196,.06);border:1px solid rgba(232,220,196,.25);border-radius:3px;padding:5px 10px;font-size:13px;letter-spacing:.08em;min-height:34px}
.tb:active{background:rgba(232,220,196,.18)}

.nav{position:fixed;top:50%;z-index:4;transform:translateY(-50%);width:44px;height:88px;border:0;background:rgba(14,12,10,.35);font-family:var(--f-mono);font-size:22px;color:var(--paper);display:flex;align-items:center;justify-content:center}
#navL{left:env(safe-area-inset-left,0px);border-radius:0 6px 6px 0}
#navR{right:env(safe-area-inset-right,0px);border-radius:6px 0 0 6px}
#compass{position:fixed;left:50%;transform:translateX(-50%);z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);font-family:var(--f-mono);font-size:11px;letter-spacing:.3em;color:var(--paper-dim);pointer-events:none;text-shadow:0 0 6px #000}

#inv{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;overflow-x:auto;
  padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(10,8,6,0),rgba(10,8,6,.9) 45%)}
#inv .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--paper-dim);writing-mode:vertical-rl;flex:none}
.it{flex:none;width:58px;height:58px;border:1px solid rgba(184,146,78,.55);border-radius:3px;background:rgba(26,22,17,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px}
.it b{font-family:var(--f-disp);font-weight:900;font-size:20px;line-height:1.1;color:var(--brass)}
.it span{font-size:10px;line-height:1.2;color:var(--paper-dim);text-align:center}
.it.empty{border-style:dashed;border-color:rgba(232,220,196,.15);background:transparent}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,5,4,.78);
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.card{width:100%;max-width:460px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#1d1813,#14110d);border:1px solid rgba(184,146,78,.4);border-radius:4px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:text;-webkit-user-select:text}
.card h2{margin:0 0 4px;font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.12em;text-wrap:balance}
.card .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;color:var(--brass);margin-bottom:12px;text-transform:uppercase}
.card p{margin:0 0 10px;font-size:15.5px}
.card p.sys{color:var(--paper-dim);font-size:13.5px}
.card p.got{color:var(--brass);font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}
.card .letter{background:#d9ccb0;color:#2a1f14;padding:16px 16px 12px;margin:6px 0 14px;border-radius:2px;font-size:15px;box-shadow:inset 0 0 30px rgba(90,60,30,.35);transform:rotate(-.6deg)}
.card .letter p{font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bt{background:var(--paper);color:var(--ink);border:0;border-radius:3px;padding:10px 16px;font-weight:700;letter-spacing:.08em;min-height:44px}
.bt.g{background:transparent;color:var(--paper);border:1px solid rgba(232,220,196,.35);font-weight:400}
.bt.r{background:var(--blood);color:#f3e6d6}
.bt[disabled]{opacity:.4}
.codebox{display:flex;gap:8px;margin-top:6px}
.codebox input{flex:1;min-width:0;font-family:var(--f-mono);font-size:24px;letter-spacing:.35em;text-align:center;background:#0c0a08;color:var(--paper);border:1px solid rgba(184,146,78,.5);border-radius:3px;padding:8px 4px}
.lbl{font-size:12.5px;color:var(--paper-dim);margin-top:8px}
.err{min-height:22px;font-size:13.5px;color:#e0776a;margin-top:6px}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.pk{border:1px solid rgba(232,220,196,.3);border-radius:3px;background:transparent;padding:10px;text-align:left;min-height:44px}
.pk.on{background:rgba(184,146,78,.25);border-color:var(--brass)}
.jl{display:flex;flex-direction:column;gap:14px}
.je .h{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;color:var(--brass)}
.je p{margin:2px 0;font-size:14px}

#title{background:radial-gradient(ellipse at 50% 30%,#2a2219 0%,#0e0c0a 70%)}
.tt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:440px;width:100%}
.logo{font-family:var(--f-disp);font-weight:900;font-size:clamp(46px,15vw,82px);letter-spacing:.18em;line-height:1;margin:0;padding-left:.18em}
.logo.ref{transform:scaleY(-1);opacity:.32;filter:blur(1px);color:var(--wB);-webkit-mask-image:linear-gradient(transparent 15%,#000);mask-image:linear-gradient(transparent 15%,#000);margin-top:-4px}
.logo.top{color:var(--wA)}
.sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.4em;color:var(--paper-dim);margin:10px 0 18px;padding-left:.4em}
.warn{font-size:12.5px;color:var(--paper-dim);max-width:34em;margin:12px auto 0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.role{border:1px solid rgba(232,220,196,.25);border-radius:3px;padding:12px;background:transparent;text-align:left;min-height:96px}
.role.on{border-color:var(--brass);background:rgba(184,146,78,.15)}
.role .nm{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.1em}
.role .d{font-size:12.5px;color:var(--paper-dim);line-height:1.5}
.role.a .nm{color:var(--wA)} .role.b .nm{color:var(--wB)}
.seg{display:flex;gap:6px;margin:4px 0 10px}
.seg button{flex:1}
#waitBar{position:fixed;left:0;right:0;z-index:8;top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;padding:6px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:rgba(70,40,20,.92);border-block:1px solid rgba(201,160,80,.5);font-size:13.5px;line-height:1.5}
#waitBar .tb{flex:none;background:var(--paper);color:var(--ink)}
#sub{position:fixed;left:0;right:0;z-index:6;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);max-height:30vh;overflow-y:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(8,6,4,0),rgba(8,6,4,.88) 22%);text-align:center}
#sub p{margin:0 auto 4px;max-width:34em;font-size:15.5px;line-height:1.65;color:#f1e6d0;text-shadow:0 1px 3px #000}
#sub p.sys{color:var(--paper-dim);font-size:13px}#sub p.got{color:var(--brass);font-family:var(--f-mono);font-size:13px}
#cuBack{position:fixed;z-index:7;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 168px);background:rgba(20,16,12,.8)}
.it{position:relative}.it canvas{width:44px;height:32px}.it.sel{border-color:#f0d080;box-shadow:0 0 0 2px rgba(240,208,128,.5),0 0 14px rgba(240,208,128,.45);background:rgba(70,56,30,.9)}
#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:40;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:rgba(20,16,12,.95);border:1px solid rgba(184,146,78,.5);padding:8px 14px;border-radius:3px;font-size:14px;max-width:calc(100vw - 32px);opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#chapcard{z-index:25;background:#070605;flex-direction:column;text-align:center}
#chapcard .k{font-family:var(--f-mono);letter-spacing:.4em;font-size:12px;color:var(--paper-dim);padding-left:.4em}
#chapcard .n{font-family:var(--f-disp);font-weight:900;font-size:clamp(34px,10vw,54px);letter-spacing:.2em;padding-left:.2em;margin:6px 0}
#chapcard .s{font-size:15px;color:var(--brass);letter-spacing:.2em}
.fadein{animation:fi 1.2s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#banner{position:fixed;left:0;right:0;z-index:6;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#banner div{background:rgba(142,20,24,.9);color:#f6e9da;padding:8px 12px;border-radius:3px;font-size:13px;pointer-events:auto;max-width:440px}
.end-n{font-family:var(--f-mono);font-size:11px;letter-spacing:.25em;color:var(--brass)}
@media (prefers-reduced-motion:reduce){#grain{animation:none}.fadein{animation:none}}
</style>
</head>
<body>


<div id="gl" aria-label="遊戲場景"></div>
<div id="vig"></div>
<canvas id="grain"></canvas>
<div id="flash"></div>

<div id="hud" hidden>
  <div id="chap"><div class="k" id="chapK">CHAPTER I</div><div class="n" id="chapN"></div><div id="who"><i id="dot"></i><span id="whoT"></span></div></div>
  <div class="hb">
    <button class="tb" id="bR">房間</button>
    <button class="tb" id="bJ">日誌</button>
    <button class="tb" id="bH">提示</button>
    <button class="tb" id="bM">選單</button>
  </div>
</div>
<div id="banner" hidden><div id="bannerT"></div></div>
<button class="nav" id="navL" hidden aria-label="向左轉">‹</button>
<button class="nav" id="navR" hidden aria-label="向右轉">›</button>
<div id="compass" hidden></div>
<div id="inv" hidden></div>
<div id="toast"></div>
<div id="sub" hidden></div>
<div id="waitBar" hidden></div>
<button class="tb" id="cuBack" hidden>‹ 返回</button>

<div class="ov" id="title">
  <div class="tt">
    <h1 class="logo top">霧澤</h1>
    <div class="logo ref" aria-hidden="true">霧澤</div>
    <div class="sub">MIST LAKE · TWINS</div>
    <p style="margin:0 0 4px">兩個世界，同一棟旅館，同一個生日。</p>
    <div class="row" style="justify-content:center" id="titleBtns"></div>
    <p class="warn">雙人合作解謎・約 60 至 120 分鐘。含血腥、獵奇與驚嚇內容。<br>建議戴耳機、熄燈，並與夥伴開著通話。</p>
  </div>
</div>

<div class="ov" id="setup" hidden><div class="card" id="setupC"></div></div>
<div class="ov" id="dlg" hidden><div class="card" id="dlgC"></div></div>
<div class="ov" id="chapcard" hidden><div class="k" id="ccK"></div><div class="n" id="ccN"></div><div class="s" id="ccS"></div></div>

<script>
'use strict';
/* ============================================================
   基本工具
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=(R,a,b)=>R==='A'?a:b;
const ROLE={A:{nm:'溫晴',w:'晴的世界',o:'B'},B:{nm:'溫晏',w:'晏的世界',o:'A'}};
const CN=['','一','二','三','四','五','六'];
const RN=['','I','II','III','IV','V','VI'];
function seeded(s){let t=s>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}

/* ============================================================
   狀態、存檔
   ============================================================ */
const S={flags:new Set(),R:null,mode:null,code:null,journal:{},seen:{},hintN:{},placed:null,placedLocal:{A:null,B:null},mute:false,ch:0,started:false,rooms:null};
const has=k=>S.flags.has(k);
function add(...ks){let c=false;for(const k of ks){if(!S.flags.has(k)){S.flags.add(k);c=true}}if(c){save();pushPresence();stateChanged()}}
function saveKey(){return 'wz3:'+S.mode+':'+(S.code||'solo')}
function save(){try{localStorage.setItem(saveKey(),JSON.stringify({f:[...S.flags],R:S.R,j:S.journal,s:S.seen,h:S.hintN,w:S.wh||{},rm:S.rooms}));localStorage.setItem('wz3:last',JSON.stringify({mode:S.mode,code:S.code,R:S.R}))}catch(e){}}
function loadSave(mode,code){try{const raw=localStorage.getItem('wz3:'+mode+':'+(code||'solo'));if(!raw)return null;return JSON.parse(raw)}catch(e){return null}}
function lastSave(){try{const l=JSON.parse(localStorage.getItem('wz3:last')||'null');if(!l)return null;const d=loadSave(l.mode,l.code);return d&&d.f&&d.f.length?l:null}catch(e){return null}}
try{S.mute=localStorage.getItem('wz3:mute')==='1'}catch(e){}

function chapterNow(){for(let n=1;n<=6;n++){if(!(has(n+'x.A')&&has(n+'x.B')))return n}return 6}
function roomNow(){const mx=chapterNow();const r=S.rooms&&S.rooms[S.R]?S.rooms[S.R]:mx;return Math.max(1,Math.min(mx,r))}
function goRoom(n){const mx=chapterNow();n=Math.max(1,Math.min(mx,n|0));if(typeof closeCU==='function')closeCU();if(!S.rooms)S.rooms={A:mx,B:mx};const from=roomNow();S.rooms[S.R]=n;S.sel=null;V3.v=0;V3.theta=0;V3.pan=0;V3.tw=null;save();if(from!==n){sfx('door');toast((n<from?'回到了':'走進了')+'「'+CH[n].t+'」')}renderInv();hudStatus();updateCompass();requestRebuild();if(S.started&&$('#dlg').hidden)checkGates()}
function round(){let r=0;while(has('rt'+r))r++;return r}
function choiceOf(R,r){r=r===undefined?round():r;for(const c of['s','g','w'])if(has('f'+r+'.'+R+':'+c))return c;return null}

/* ============================================================
   道具
   ============================================================ */
const ITEMS={
  knob:{n:'黃銅旋鈕',g:'鈕',d:'一個黃銅旋鈕，背面有一根方形的軸，像是從什麼鎖上拆下來的。'},
  band:{n:'住院手環',g:'環',doc:1,d:'一條褪色的住院手環：「溫若蘭　待產・雙胎　病房 203　1998.10.26 入院」。被剪斷了。'},
  skey:{n:'小鐵鑰匙',g:'匙',d:'一把很小的鐵鑰匙，從大衣口袋裡找到的。齒很短，像是開抽屜用的。'},
  cert:{n:'死亡證明書',g:'證',doc:1,d:'死者：溫若蘭，二十六歲。死亡時間：一九九八年十月二十七日，二十三時四十七分。死因：產後大出血。紙的背面有一枚很小的血手印。'},
  poker:{n:'撥火棍',g:'棍',d:'生鏽的鐵撥火棍，尖端黏著黑色的灰。'},
  photo:{n:'燒焦的照片',g:'照',doc:1,d:'照片燒掉了一半。剩下的那一半，是兩個並排躺著的嬰兒。背面寫著：「鐘門的小鑰匙，收在只有下雨天才會打開的東西裡。」'},
  opener:{n:'拆信刀',g:'刀',d:'黃銅拆信刀，刀柄是一隻收著翅膀的飛蛾。刀口很利。'},
  ckey2:{n:'鐘門鑰匙',g:'鐘',d:'一把小小的黃銅鑰匙，鑰匙柄做成鐘擺的形狀。'},
  tooth:{n:'乳牙',g:'牙',doc:1,d:'一顆很小的乳牙，牙根上沾著乾掉的血。這棟房子裡，不該有小孩掉過牙。'},

  {id:'diary',v:3,u:2.05,y:-1.36,d:.3,tap:R=>R==='A'

/* ---------- 獨立網站用的連線：MQTT over WebSocket（公開中繼伺服器，免帳號） ---------- */
const MQ_BROKERS=(()=>{try{const q=new URLSearchParams(location.search).get('mq');if(q)return q.split(',')}catch(e){}return['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt']})();
function mqClient(url,cid,will,onMsg,onUp,onDown,pre){
  const te=new TextEncoder(),td=new TextDecoder();let ws=null,buf=new Uint8Array(0),ping=null,up=false,closed=false,pid=1,subs=[],retryT=null;
  const vlen=n=>{const o=[];do{let b=n%128;n=Math.floor(n/128);if(n>0)b|=128;o.push(b)}while(n>0);return o};
  const str=s=>{const b=te.encode(s);return[b.length>>8,b.length&255,...b]};
  const pkt=(h,body)=>new Uint8Array([h,...vlen(body.length),...body]);
  const send=a=>{try{if(ws&&ws.readyState===1)ws.send(a)}catch(e){}};
  function connect(){if(closed)return;try{ws=new WebSocket(url,['mqtt'])}catch(e){schedule();return}ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    ws.onopen=()=>{const wb=te.encode(will.payload);send(pkt(0x10,[...str('MQTT'),4,0x06,0,30,...str(cid),...str(will.topic),wb.length>>8,wb.length&255,...wb]))};
    ws.onmessage=e=>{const d=new Uint8Array(e.data);const nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;parse()};
    ws.onclose=()=>{const was=up;up=false;clearInterval(ping);if(was)onDown();schedule()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
  function schedule(){if(closed)return;clearTimeout(retryT);retryT=setTimeout(connect,3000)}
  function parse(){for(;;){if(buf.length<2)return;let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);if(buf.length<i+len)return;
    const h=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);const t=h>>4;
    if(t===2){if(body[1]===0){up=true;ping=setInterval(()=>send(new Uint8Array([0xC0,0])),20000);if(pre){pre.forEach(([t,pl])=>send(pkt(0x31,[...str(t),...te.encode(pl)])));pre=null}subs.forEach(s=>sub0(s));onUp()}else{try{ws.close()}catch(e){}}}
    else if(t===3){const tl=(body[0]<<8)|body[1];const topic=td.decode(body.slice(2,2+tl));let off=2+tl;if((h>>1)&3)off+=2;try{onMsg(topic,td.decode(body.slice(off)),!!(h&1))}catch(e){console.error(e)}}}}
  function sub0(f){const id=pid++&0xffff||1;send(pkt(0x82,[id>>8,id&255,...str(f),0]))}
  connect();
  return{get up(){return up},url,
    sub(f){subs.push(f);if(up)sub0(f)},
    pub(topic,payload,retain){if(!up)return;send(pkt(0x30|(retain?1:0),[...str(topic),...te.encode(payload)]))},
    end(){closed=true;clearTimeout(retryT);clearInterval(ping);try{send(new Uint8Array([0xE0,0]));ws.close()}catch(e){}}}}
async function goOnlineMQ(code,fresh){
  const base='mistlake-twins/v3/'+code+'/';const cid='wz'+Math.random().toString(36).slice(2,12);
  const M=NET.mq={base,cid,clients:[],peers:{},states:{},hbT:null,lastHb:0};
  const onMsg=(topic,payload)=>{if(!topic.startsWith(base))return;const sub=topic.slice(base.length);let d=null;try{d=JSON.parse(payload)}catch(e){return}if(!d||typeof d!=='object')return;
    if(sub==='h'){if(typeof d.c!=='string'||d.c===cid)return;if(d.off){delete M.peers[d.c]}else{const isNew=!M.peers[d.c];M.peers[d.c]={r:d.r==='A'||d.r==='B'?d.r:null,t:Date.now()};if(isNew){heartbeat(true);if(S.started)pushPresence(true)}}readPeers();return}
    const m=/^s\/(A|B)$/.exec(sub);if(m){M.states[m[1]]={f:Array.isArray(d.f)?d.f:[],pl:typeof d.pl==='string'?d.pl:null,c:d.c};readPeers()}};
  const will={topic:base+'h',payload:JSON.stringify({c:cid,off:1})};
  const anyUp=()=>M.clients.some(x=>x.up);
  const onUp=()=>{NET.conn=true;NET.live=true;hudStatus();pushPresence(true);heartbeat(true)};
  const onDown=()=>{NET.conn=anyUp();NET.live=NET.conn;hudStatus()};
  for(const u of MQ_BROKERS.slice(0,2)){const cl=mqClient(u,cid,will,onMsg,onUp,onDown,fresh?[[base+'s/A',''],[base+'s/B','']]:null);cl.sub(base+'#');M.clients.push(cl)}
  M.hbT=setInterval(()=>{heartbeat();readPeers()},8000);
  addEventListener('pagehide',()=>{M.clients.forEach(cl=>{cl.pub(base+'h',JSON.stringify({c:cid,off:1}),false);cl.end()})});
  for(let i=0;i<60;i++){if(anyUp())return'ok';await new Promise(r=>setTimeout(r,200))}
  M.clients.forEach(cl=>cl.end());NET.mq=null;clearInterval(M.hbT);return'fail'}
function heartbeat(force){const M=NET.mq;if(!M||!S.R)return;const now=Date.now();const ch=M.lastR!==S.R;if(!ch&&!force&&now-M.lastHb<7000)return;if(!ch&&force&&now-M.lastHb<800)return;M.lastHb=now;M.lastR=S.R;M.clients.forEach(cl=>cl.pub(M.base+'h',JSON.stringify({c:M.cid,r:S.R}),false))}
function mqPeers(){const M=NET.mq;if(!M)return[];const now=Date.now();const out=[];
  for(const [c,p] of Object.entries(M.peers)){if(now-p.t>26000){delete M.peers[c];continue}const st=p.r&&M.states[p.r];out.push({isMe:false,presence:{g:'wz3',r:p.r,f:[],pl:st&&p.r!==S.R?st.pl:null}})}
  const all=[];for(const R of['A','B'])if(M.states[R])all.push(...M.states[R].f);if(all.length)out.push({isMe:false,presence:{g:'wz3',r:null,f:all,pl:null,_flagsOnly:1}});return out}

let AC=null,drone=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function startDrone(){
  if(!AC||S.mute)return;stopDrone();
  try{const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);g.gain.linearRampToValueAtTime(.05,AC.currentTime+3);
  const base=S.R==='B'?41:49;const os=[base,base*1.503,base*2.01].map((f,i)=>{const o=AC.createOscillator();o.type=i?'sine':'sawtooth';o.frequency.value=f;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;o.connect(lp);lp.connect(g);o.start();return o});
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.11;lg.gain.value=.025;l.connect(lg);lg.connect(g.gain);l.start();
  drone={g,os:[...os,l]}}catch(e){}
}
function stopDrone(){if(!drone)return;try{drone.g.gain.cancelScheduledValues(AC.currentTime);drone.g.gain.setValueAtTime(drone.g.gain.value,AC.currentTime);drone.g.gain.linearRampToValueAtTime(0,AC.currentTime+.4);const d=drone;setTimeout(()=>d.os.forEach(o=>{try{o.stop()}catch(e){}}),500)}catch(e){}drone=null}
function tone(f,t0,dur,type,vol){if(!AC||S.mute)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.12,AC.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+dur);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+dur+.05)}catch(e){}}
function sfx(k){
  if(!AC||S.mute)return;
  if(k==='ok'){[523,659,784].forEach((f,i)=>tone(f,i*.09,.9,'triangle',.08))}
  else if(k==='bad'){tone(98,0,.35,'square',.05);tone(104,0,.35,'square',.05)}
  else if(k==='gore'){tone(55,0,.25,'sine',.25);tone(52,.28,.3,'sine',.22)}
  else if(k==='lake'){[220,277,330,277].forEach((f,i)=>tone(f,i*.18,1.4,'sine',.06))}
  else if(k==='page'){tone(1800,0,.05,'triangle',.02)}
  else if(k==='door'){tone(70,0,.9,'sawtooth',.05);tone(140,.1,.6,'triangle',.03)}
  else if(k==='end'){[196,233,294,392].forEach((f,i)=>tone(f,i*.35,2.2,'sine',.07))}
}
function playTune(ns){const sc={1:523,2:587,3:659,4:698,5:784,6:880,7:988};ns.forEach((n,i)=>tone(sc[n],i*.42,1.2,'triangle',.1))}

  const list=cuHsOf(key);let best=null,bd=1e9;for(let i=list.length-1;i>=0;i--){const r=list[i].r;const pad=14/m.s;if(wx>=r[0]-pad&&wx<=r[0]+r[2]+pad&&wy>=r[1]-pad&&wy<=r[1]+r[3]+pad){const inside=wx>=r[0]&&wx<=r[0]+r[2]&&wy>=r[1]&&wy<=r[1]+r[3];const d=Math.hypot(wx-r[0]-r[2]/2,wy-r[1]-r[3]/2)/Math.max(1,Math.min(r[2],r[3]))+(inside?0:100);if(d<bd){bd=d;best=i}}}
  if(best!==null){const h=list[best];{const sk='cu:'+key+':'+h.id+':'+S.R;if(!S.seen[sk]){S.seen[sk]=1;save()}cacheKey='';
    if(S.sel){const it=S.sel;const fn=h.use&&h.use[it];if(fn){const res=fn(S.R);if(res===null){sfx('bad');say('這裡用不上「'+ITEMS[it].n+'」。');return}if(!(res&&res.keep))S.sel=null;renderInv();sfx('ok');cuResult(res,key+':'+h.id)}else{sfx('bad');say('這裡用不上「'+ITEMS[it].n+'」。')}return}
    if(h.tap)cuResult(h.tap(S.R),key+':'+h.id);return}}
  if(S.sel){say('這裡用不上「'+ITEMS[S.sel].n+'」。')}}

    BIG=null;LWK=1;cc.restore();
    const vg=cc.createRadialGradient(350,330,220,350,350,520);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(8,5,2,.55)');cc.fillStyle=vg;cc.fillRect(0,0,700,700);cacheCv=cv;cacheKey=k}
  const a=Math.min(1,(performance.now()-CUS.fade)/220);c.globalAlpha=a;c.drawImage(cacheCv,L.ox*DPR,L.oy*DPR,cacheCv.width,cacheCv.height);c.globalAlpha=1;

DOCS.notesA={title:'最後的筆記・上',draw:(c,R)=>{tableBg(c);const done=sheet(c,80,60,540,580,-.03,'#e8dcc0',81);tx(c,'最後的筆記（上）',0,-250,22,INK,{b:1});
  ['十四年前，我和另一邊的我，','在同一夜走進湖裡，','都想把對方世界的孫子帶過來。','我們忘了，我們是同一個人。','湖不允許同一個人同時往兩個方向走，','所以它把我分成了兩半。'].forEach((t2,i)=>hand(c,t2,-230,-190+i*40,19,'#2a2050'));
  hand(c,'鐘樓的門，以四個時刻為匙。',-230,90,22,'#9a1014',{b:1});hand(c,'依先後排列，只取分鐘。',-230,128,22,'#9a1014',{b:1});handprint(c,170,220,1);done()}};
DOCS.notesB={title:'最後的筆記・下',draw:(c,R)=>{tableBg(c);const done=sheet(c,80,60,540,580,.02,'#e2d6ba',82);tx(c,'最後的筆記（下）',0,-250,22,INK,{b:1});
  hand(c,'晴生、晏生、若蘭逝、我碎。',-230,-190,24,'#9a1014',{b:1});['如果我失敗了：把我送回湖裡。','兩半的我合起來，就是一個完整的人，','剛好是一個人的重量。','湖收下我，就會放一個孩子過橋。','心在哪一邊，哪一邊就是歸處。'].forEach((t2,i)=>hand(c,t2,-230,-120+i*40,18,'#2a2050'));
  hand(c,'以活人入湖，可換回死去的那一個。',-230,120,18,'#2a2050');ln(c,-236,120,220,118,3,'#c0141a');ln(c,-236,126,220,116,2,'#c0141a');hand(c,'錯了。錯了。錯了。',-80,170,22,'#c0141a',{b:1});done()}};

}
function placeBack(){const wb=$('#waitBar');const top=!wb.hidden?wb.getBoundingClientRect().bottom:(($('#hud').getBoundingClientRect().bottom)||110);$('#cuBack').style.top=(top+8)+'px';cacheKey=''}
function showWaitBar(kind){const el=$('#waitBar');if(!kind){el.hidden=true;placeBack();return}const O=ROLE[ROLE[S.R].o].nm;
  el.innerHTML='<span>'+(kind==='exit'?'路已經打開。等'+esc(O)+'跟上。你仍可繼續找線索，或從「房間」回到之前的地方。':'你已經做出選擇，等'+esc(O)+'的答案。')+'</span>'+(S.mode==='solo'?'<button class="tb" id="swRole">切換到'+esc(O)+'</button>':'');el.hidden=false;const b=$('#swRole');if(b)b.onclick=()=>switchRole();placeBack()}
function showWait(kind){
  const O=ROLE[ROLE[S.R].o].nm;let h='';
  if(kind==='exit')h='<div class="tag">等待中</div><h2>你走進了門後的黑暗</h2><p>等待'+esc(O)+'跟上。另一個世界的路，只有'+esc(O)+'自己能走。</p>';
  else h='<div class="tag">等待中</div><h2>你已經做出選擇</h2><p>指針一格一格地逼近十二點。等待'+esc(O)+'的答案。</p>';
  if(S.mode==='solo')h+='<div class="row"><button class="bt" id="swRole">切換到'+esc(O)+'的世界</button></div>';
  else h+='<p class="sys">'+(NET.partner?'夥伴在線，進度會自動同步。':'夥伴目前不在線。對方回來後，進度會自動同步。')+'</p>';
  const c=$('#setupC');c.innerHTML=h;$('#setup').hidden=false;gateShown=kind;
  const sw=$('#swRole');if(sw)sw.onclick=()=>switchRole();
}
function switchRole(){closeCU();S.sel=null;S.R=ROLE[S.R].o;save();$('#setup').hidden=true;gateShown=null;V3.v=0;V3.theta=0;V3.pan=0;builtR=null;stopDrone();startDrone();renderInv();hudStatus();requestRebuild();toast('現在是'+ROLE[S.R].nm+'的世界');checkGates()}
function showEnding(n){
  showWaitBar(null);add('E'+n);const r=round(),mine=choiceOf(S.R,r);const e=endingText(n,S.R,mine);sfx('end');stopDrone();
  const seen=[1,2,3,4,5].filter(k=>has('E'+k)).length;
  const c=$('#setupC');c.innerHTML='<div class="end-n">結局 '+n+'／5'+(n===2?'・真結局':'')+'</div><h2 style="font-size:24px;margin:6px 0 12px">'+esc(e.t)+'</h2>'+pHTML(e.p)+'<p class="sys">你選了「'+esc(OPT[mine].l)+'」，'+esc(ROLE[ROLE[S.R].o].nm)+'選了「'+esc(OPT[choiceOf(ROLE[S.R].o,r)].l)+'」。已解鎖結局 '+seen+'／5。</p><div class="row"><button class="bt" id="retry">回到抉擇之前</button><button class="bt g" id="toTitle">回到標題</button></div>';
  $('#setup').hidden=false;gateShown='end'+r;
  $('#retry').onclick=()=>{gateShown=null;$('#setup').hidden=true;startDrone();add('rt'+r);checkGates()};
  $('#toTitle').onclick=()=>location.reload();
}

/* ---------- 選單、日誌、提示 ---------- */
function openJournal(){
  const es=Object.values(S.journal).filter(e=>e.R===S.R).sort((a,b)=>a.ch-b.ch||a.ts-b.ts);
  let h='<div class="tag">'+esc(ROLE[S.R].nm)+'的日誌</div><h2>線索</h2>';
  if(!es.length)h+='<p class="sys">還沒有記下任何線索。調查到的重要內容會自動記在這裡。</p>';
  else h+='<div class="jl">'+es.map(e=>'<div class="je"><div class="h">第'+CN[e.ch]+'章・'+esc(e.t)+'</div>'+e.p.map(t=>'<p>'+esc(t)+'</p>').join('')+'</div>').join('')+'</div>';
  h+='<div class="row"><button class="bt g" id="dlgClose">關閉</button></div>';
  const c=$('#dlgC');c.innerHTML=h;$('#dlg').hidden=false;c.scrollTop=0;$('#dlgClose').onclick=closeDlg;
}
function openHint(){
  const ch=chapterNow(),key=ch+S.R,list=CH[ch].hint[S.R];const n=S.hintN[key]||0;
  let h='<div class="tag">提示・第'+CN[ch]+'章</div><h2>卡關了嗎？</h2>';
  if(!n)h+='<p class="sys">提示會一步一步變得更直接。最後一則會直接給答案。</p>';
  for(let i=0;i<n;i++)h+='<p>'+(i+1)+'．'+esc(list[i])+'</p>';
  h+='<div class="row">'+(n<list.length?'<button class="bt" id="moreHint">'+(n?'再給一則':'給我一則提示')+'</button>':'')+'<button class="bt g" id="dlgClose">關閉</button></div>';
  const c=$('#dlgC');c.innerHTML=h;$('#dlg').hidden=false;$('#dlgClose').onclick=closeDlg;
  const m=$('#moreHint');if(m)m.onclick=()=>{S.hintN[key]=n+1;save();openHint()};
}
function openMenu(){
  let h='<div class="tag">選單</div><h2>霧澤雙生</h2><p class="sys">進度在每一步都會自動儲存。</p><div class="row" style="flex-direction:column;align-items:stretch">';
  h+='<button class="bt g" id="mSound">聲音：'+(S.mute?'關':'開')+'</button>';
  if(S.mode==='solo')h+='<button class="bt g" id="mSwap">切換到'+esc(ROLE[ROLE[S.R].o].nm)+'的世界</button>';
  else h+='<button class="bt g" id="mSwap">改扮演'+esc(ROLE[ROLE[S.R].o].nm)+'</button>';
  h+='<button class="bt g" id="mTitle">回到標題</button>';
  if(S.mode==='solo')h+='<button class="bt r" id="mReset">清除這局，重新開始</button>';
  h+='<button class="bt" id="dlgClose">繼續遊戲</button></div>';
  const c=$('#dlgC');c.innerHTML=h;$('#dlg').hidden=false;$('#dlgClose').onclick=closeDlg;
  $('#mSound').onclick=()=>{S.mute=!S.mute;try{localStorage.setItem('wz3:mute',S.mute?'1':'0')}catch(e){}if(S.mute)stopDrone();else{audioInit();startDrone()}openMenu()};
  $('#mSwap').onclick=()=>{closeDlg();closeCU();S.sel=null;if(S.mode==='solo')switchRole();else{S.R=ROLE[S.R].o;save();pushPresence(true);builtR=null;V3.v=0;V3.theta=0;stopDrone();startDrone();renderInv();hudStatus();requestRebuild();checkGates()}};
  $('#mTitle').onclick=()=>location.reload();
  const rs=$('#mReset');if(rs)rs.onclick=()=>{rs.textContent='再按一次確認清除';rs.onclick=()=>{try{localStorage.removeItem(saveKey())}catch(e){}location.reload()}};
}

/* ---------- 標題與設定 ---------- */
function titleScreen(){
  const b=$('#titleBtns');const last=lastSave();
  let h='<button class="bt" id="tNew">開始</button>';
  if(last)h='<button class="bt" id="tCont">繼續（'+(last.mode==='solo'?'單機':'房間 '+esc(last.code))+'・'+esc(ROLE[last.R]?ROLE[last.R].nm:'')+'）</button>'+h.replace('class="bt"','class="bt g"');
  b.innerHTML=h;
  $('#tNew').onclick=()=>{audioInit();setupScreen()};
  const ct=$('#tCont');if(ct)ct.onclick=()=>{audioInit();resumeGame(last)};
}
let setupState={mode:'online',R:null,code:''};
function setupScreen(){
  $('#title').hidden=true;const c=$('#setupC');$('#setup').hidden=false;
  const st=setupState;
  let h='<div class="tag">新的一局</div><h2>怎麼玩</h2><div class="seg"><button class="bt '+(st.mode==='online'?'':'g')+'" id="mOn">兩支手機連線</button><button class="bt '+(st.mode==='solo'?'':'g')+'" id="mSolo">一支手機試玩</button></div>';
  if(st.mode==='online'){
    h+='<p class="sys">兩人各用自己的手機開這個頁面，輸入同一組房間代碼，再各選一個角色。開著通話玩最好。</p>';
    h+='<div class="lbl">房間代碼（4 位數字）</div><div class="codebox"><input id="roomIn" inputmode="numeric" maxlength="4" value="'+esc(st.code)+'" aria-label="房間代碼"><button class="bt g" id="roomNew">產生</button></div>';
  }else h+='<p class="sys">兩個世界都在同一支手機上，用選單切換。適合一個人試玩，或兩人輪流拿手機。</p>';
  h+='<div class="lbl">選擇你的角色</div><div class="roles"><button class="role a '+(st.R==='A'?'on':'')+'" data-r="A"><div class="nm">溫晴</div><div class="d">古董鐘錶修復師。<br>她的世界快了七分鐘。</div></button><button class="role b '+(st.R==='B'?'on':'')+'" data-r="B"><div class="nm">溫晏</div><div class="d">急診室護理師。<br>他的世界慢了七分鐘。</div></button></div>';
  h+='<div class="err" id="setErr" role="status"></div><div class="row"><button class="bt" id="goBtn">進入霧澤</button><button class="bt g" id="backBtn">返回</button></div>';
  c.innerHTML=h;
  $('#mOn').onclick=()=>{st.mode='online';setupScreen()};$('#mSolo').onclick=()=>{st.mode='solo';setupScreen()};
  c.querySelectorAll('.role').forEach(b=>b.onclick=()=>{st.R=b.dataset.r;const ri=$('#roomIn');if(ri)st.code=ri.value;setupScreen()});
  const rn=$('#roomNew');if(rn)rn.onclick=()=>{st.code=String(Math.floor(1000+Math.random()*9000));$('#roomIn').value=st.code};
  const ri=$('#roomIn');if(ri)ri.addEventListener('input',()=>{ri.value=ri.value.replace(/\D/g,'').slice(0,4);st.code=ri.value});
  $('#backBtn').onclick=()=>{$('#setup').hidden=true;$('#title').hidden=false};
  $('#goBtn').onclick=async()=>{
    if(!st.R){$('#setErr').textContent='先選一個角色。';return}
    if(st.mode==='online'&&!/^\d{4}$/.test(st.code)){$('#setErr').textContent='房間代碼要 4 位數字。按「產生」可以拿到一組新的，再告訴夥伴。';return}
    if(st.mode==='online'){$('#goBtn').disabled=true;$('#setErr').textContent='連線中……';const r=await goOnline(st.code,!loadSave('online',st.code));$('#goBtn').disabled=false;
      if(r!=='ok'){$('#setErr').textContent=r==='none'?'這個畫面無法連線（需要在 claude.ai 登入後開啟，夥伴也需要被分享這個頁面）。你可以先用「一支手機試玩」。':'連不上連線伺服器。請確認網路正常（部分公司或學校 Wi-Fi 會擋），稍後再試，或先用「一支手機試玩」。';return}}
    startGame(st.mode,st.mode==='online'?st.code:null,st.R);
  };
}
async function resumeGame(l){
  if(l.mode==='online'){$('#title').hidden=true;$('#setup').hidden=false;$('#setupC').innerHTML='<h2>連線中……</h2><p class="sys">正在回到房間 '+esc(l.code)+'。</p>';const r=await goOnline(l.code);
    if(r!=='ok'){$('#setupC').innerHTML='<h2>連不上房間</h2><p>這個畫面目前無法連線。進度都還在，你可以稍後再試，或先用單機模式玩同一份進度。</p><div class="row"><button class="bt" id="rSolo">用單機模式繼續</button><button class="bt g" id="rBack">返回</button></div>';
      $('#rSolo').onclick=()=>{const d=loadSave('online',l.code);startGame('solo',null,l.R,d)};$('#rBack').onclick=()=>location.reload();return}}
  startGame(l.mode,l.code,l.R);
}
function startGame(mode,code,R,importData){
  S.mode=mode;S.code=code;S.R=R;
  const d=importData||loadSave(mode,code);
  if(d){(d.f||[]).forEach(k=>S.flags.add(k));S.journal=d.j||{};S.seen=d.s||{};S.hintN=d.h||{};S.wh=d.w||{};S.rooms=d.rm||null}
  if(!S.rooms){const c0=chapterNow();S.rooms={A:c0,B:c0}}
  save();pushPresence(true);
  $('#title').hidden=true;$('#setup').hidden=true;
  const ok=initGL();
  if(!ok){$('#setup').hidden=false;$('#setupC').innerHTML='<h2>無法顯示畫面</h2><p>這台裝置或瀏覽器目前無法繪製遊戲畫面。請改用較新的手機瀏覽器，或在 claude.ai 的網頁版開啟。</p>';return}
  ['#hud','#inv','#navL','#navR','#compass'].forEach(s=>$(s).hidden=false);onResize();
  primeNotices();S.started=true;startDrone();renderInv();hudStatus();updateCompass();
  const go=()=>{buildScene();checkGates()};
  (document.fonts&&document.fonts.load?Promise.race([document.fonts.load('700 20px "Noto Serif TC"'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(go,go);
}
$('#cuBack').onclick=()=>{cuBack();S.sel=null;renderInv()};$('#sub').onclick=()=>hideSay();
$('#navL').onclick=()=>turn(-1);$('#navR').onclick=()=>turn(1);
$('#bR').onclick=openRooms;$('#bJ').onclick=openJournal;$('#bH').onclick=openHint;$('#bM').onclick=openMenu;
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{document.hidden?AC.suspend():AC.resume()}catch(e){}});
window.addEventListener('error',e=>{console.error(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason)});

/* 顆粒雜訊 */
(function(){const c=$('#grain');c.width=c.height=256;const x=c.getContext('2d');const im=x.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);c.style.width='100%';c.style.height='100%'})();

titleScreen();
window.__wz={goRoom,roomNow,openRooms,cuMap,CU,CUS,cuLayout,openCU,closeCU,L:()=>({s:LAY.s,ox:wallOX(),oy:LAY.oy,pl:V3.panLim}),S,has,add,tap:tapHS,chapterNow,inv,round,choiceOf,turn,V3,setRole:r=>{S.R=r},switchRole,checkExchange};
</script>
